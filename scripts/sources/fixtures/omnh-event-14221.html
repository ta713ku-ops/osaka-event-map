    <h1 class="entry-title">受験研究社・大阪市立自然史博物館共催「おでかけプラス＋」謎解きイベントを9月12日に開催！</h1>
    <div class="entry-meta"><span class="published">2026年8月29日</span></div>
  </header>
  <div class="entry-body">
    <figure><img src="https://omnh.jp/wp/wp-content/uploads/2026/08/odekake.jpeg" alt=""></figure>
    <p>大阪市立自然史博物館は、株式会社増進堂・受験研究社と共同で、小学生とその保護者を対象にした「おでかけプラス＋」謎解きイベントを2026年9月12日（土）に開催いたします。</p>
    <p>■日時：2026 年9月12日（土）10:00～16:30（12:00～13:00は除く）</p>
    <p>■場所：大阪市立自然史博物館 本館（受付：ナウマンホール）</p>
    <p>■対象者：小学生とその保護者（3年生～6年生推奨）</p>
    <p>■参加費：無料　※常設展の入館料が別途必要です。</p>
  </div>
  <div class="entry-footer"></div>
</article>
