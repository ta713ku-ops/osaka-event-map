name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore last-good collection snapshot
        id: collection-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/collection-report.json
            data/sources/270008_event.csv
          key: osaka-event-collection-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            osaka-event-collection-${{ github.repository }}-
      - name: Refresh official event sources
        run: npm run collect
      - name: Save last-good collection snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/sources/collection-report.json
            data/sources/270008_event.csv
          key: osaka-event-collection-${{ github.repository }}-${{ github.run_id }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:collect
      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
